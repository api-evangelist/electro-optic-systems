aid: electro-optic-systems

name: Electro Optic Systems

description: 'Electro Optic Systems (EOS) is an Australian defence and space systems technology company that,
  per its own site, has designed, manufactured and exported advanced technology systems for more than 40 years.
  Its product range covers remote weapon systems (R150-R800), high energy laser weapons (Apollo), UAS interceptors
  and AI-enabled command-and-control for layered counter-drone capability, and ground-based space control capabilities
  such as optical tracking telescopes, space domain awareness and satellite laser ranging. EOS publishes no public
  developer API, documentation or developer portal on eos-aus.com. Surfaced via the API Evangelist harvest backlog
  (source: australia-apidays-2026).'

